name: Deploy development demo to GitHub Pages

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout development
        uses: actions/checkout@v6

      - name: Prepare demo artifact
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          python - <<'PY'
          from pathlib import Path
          marker = '<meta name="robots" content="noindex, nofollow, noarchive">'
          for path in Path('_site').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  text = text.replace('<head>', '<head>\n    ' + marker, 1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
