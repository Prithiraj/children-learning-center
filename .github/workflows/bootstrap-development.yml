name: Bootstrap development site

on:
  push:
    branches:
      - development
    paths:
      - bootstrap/complete

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development
        uses: actions/checkout@v4

      - name: Restore validated site files
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* | tr -d '\n' | base64 --decode > /tmp/site-bootstrap.tar.gz
          tar -xzf /tmp/site-bootstrap.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-development.yml

      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build approved learning center website [skip ci]"
          git push origin HEAD:development
